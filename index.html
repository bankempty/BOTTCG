<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT TCG - Weekly Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #07090e; background-image: radial-gradient(circle at 50% 0%, rgba(16,185,129,0.12) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(99,102,241,0.08) 0%, transparent 40%); }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .card { background: rgba(15,23,42,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51,65,85,0.6); box-shadow: 0 8px 32px rgba(0,0,0,0.37); }
        .card-glow { border: 1px solid rgba(16,185,129,0.3); box-shadow: 0 0 20px rgba(16,185,129,0.15); }
        .btn-primary { background: linear-gradient(135deg,#10b981,#059669); box-shadow: 0 0 15px rgba(16,185,129,0.3); }
        .btn-primary:hover { box-shadow: 0 0 25px rgba(16,185,129,0.5); }
        .btn-admin { background: linear-gradient(135deg,#3b82f6,#1d4ed8); }
        .rank-1 { color: #fbbf24; }
        .rank-2 { color: #94a3b8; }
        .rank-3 { color: #b45309; }
        .highlight-row { background: rgba(16,185,129,0.08) !important; }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-4 md:p-8">
<div class="max-w-5xl mx-auto space-y-5">

    <!-- HEADER -->
    <header class="card card-glow p-5 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-slate-900/90 border border-emerald-500/40 flex items-center justify-center overflow-hidden">
                <img src="https://i.ibb.co/vnFCDvL/images-4.jpg" alt="Logo" class="max-w-full max-h-full object-contain rounded-lg">
            </div>
            <div>
                <h1 class="text-2xl font-extrabold font-cyber bg-gradient-to-r from-emerald-400 via-teal-200 to-cyan-400 bg-clip-text text-transparent">BOT TCG</h1>
                <p class="text-xs text-emerald-400/80 font-mono tracking-widest">WEEKLY STANDINGS DASHBOARD</p>
            </div>
        </div>
        <div class="flex items-center gap-3 flex-wrap justify-center">
            <!-- Branch selector -->
            <div class="flex gap-1.5" id="branch-btns">
                <button onclick="setBranch('สุพรีมสามเสน')" id="br-สุพรีมสามเสน" class="px-3 py-1.5 rounded-xl text-xs font-bold transition border border-emerald-500/40 text-emerald-400 bg-emerald-500/10">สามเสน</button>
                <button onclick="setBranch('ชลบุรี')" id="br-ชลบุรี" class="px-3 py-1.5 rounded-xl text-xs font-bold transition border border-slate-700 text-slate-400 hover:text-slate-200">ชลบุรี</button>
                <button onclick="setBranch('ศรีราชา')" id="br-ศรีราชา" class="px-3 py-1.5 rounded-xl text-xs font-bold transition border border-slate-700 text-slate-400 hover:text-slate-200">ศรีราชา</button>
            </div>
            <div id="auth-btn"></div>
        </div>
    </header>

    <!-- PUBLIC DASHBOARD -->
    <div id="sec-public" class="space-y-5">
        <!-- Latest standings -->
        <div id="latest-card" class="card card-glow rounded-2xl overflow-hidden hidden">
            <div class="p-5 border-b border-slate-800/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                    <h2 id="latest-title" class="font-bold text-emerald-400 font-cyber text-lg"></h2>
                    <p id="latest-date" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <span class="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 px-3 py-1 rounded-full font-mono">📊 ผลล่าสุด</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-900/80 text-xs uppercase font-mono text-emerald-400 border-b border-slate-800">
                        <tr>
                            <th class="px-4 py-3">Pos</th>
                            <th class="px-4 py-3">Player</th>
                            <th class="px-4 py-3 text-center">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="latest-tbody" class="divide-y divide-slate-800/60"></tbody>
                </table>
            </div>
        </div>
        <div id="no-data" class="card p-10 rounded-2xl text-center text-slate-500">ยังไม่มีข้อมูลสำหรับสาขานี้</div>

        <!-- History list -->
        <div id="history-section" class="hidden space-y-3">
            <h3 class="text-sm font-bold text-slate-400 font-mono uppercase tracking-wider">📂 ผลย้อนหลัง</h3>
            <div id="history-list" class="space-y-2"></div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="sec-admin" class="hidden space-y-5">
        <div class="card rounded-2xl p-5 border border-blue-500/20 space-y-5">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-blue-400 font-cyber">⚙️ ADMIN — เพิ่มผลการแข่งขัน</h2>
                <span id="admin-branch-badge" class="text-xs font-mono bg-blue-500/10 border border-blue-500/30 text-blue-300 px-3 py-1 rounded-full"></span>
            </div>

                        <div class="flex flex-wrap gap-3">
                            <button onclick="showManualForm()" class="btn-primary text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                ➕ เพิ่มผลการแข่งขัน
                            </button>
                            <button onclick="showPasteBox()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 font-bold px-6 py-2.5 rounded-xl text-sm transition">
                                📋 วาง Text ให้ระบบอ่าน
                            </button>
                        </div>

                        <!-- Paste box -->
                        <div id="paste-box" class="hidden mt-3 space-y-3">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-slate-400 font-semibold">📋 วางข้อความตาราง Standing ที่นี่ (copy จากโปรแกรมได้เลย)</label>
                                <button onclick="hidePasteBox()" class="text-slate-500 hover:text-slate-300 text-xs">✕ ปิด</button>
                            </div>
                            <textarea id="paste-input" rows="10" placeholder="วาง text ที่ copy มาได้เลย..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-200 placeholder-slate-600 focus:outline-none focus:border-emerald-500 resize-y"></textarea>
                            <div id="paste-error" class="hidden text-red-400 text-xs p-2 bg-red-500/10 rounded-lg border border-red-500/20"></div>
                            <div class="flex gap-2 justify-end">
                                <button onclick="hidePasteBox()" class="text-slate-400 hover:text-slate-200 text-xs px-4 py-2">ยกเลิก</button>
                                <button onclick="parsePastedText()" class="btn-primary text-slate-950 font-bold px-5 py-2 rounded-xl text-xs transition">🔍 อ่านข้อมูล</button>
                            </div>

            <!-- Form (OCR result or manual) -->
            <div id="entry-form" class="hidden space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">ชื่องาน</label>
                        <input type="text" id="f-name" placeholder="เช่น BOT TCG Weekly #15" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1">วันที่แข่งขัน</label>
                        <input type="date" id="f-date" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Standings table editor -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs text-slate-400">ตาราง Standing</label>
                        <button onclick="addRow()" class="text-xs text-blue-400 hover:text-blue-300">+ เพิ่มแถว</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs">
                            <thead class="bg-slate-900 text-slate-400 uppercase font-mono">
                                <tr>
                                    <th class="px-2 py-2">Pos</th>
                                    <th class="px-2 py-2 text-left">Player</th>
                                    <th class="px-2 py-2">Pts</th>
                                    <th class="px-2 py-2"></th>
                                </tr>
                            </thead>
                            <tbody id="form-tbody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="flex gap-3 justify-end">
                    <button onclick="cancelForm()" class="text-slate-400 hover:text-slate-200 text-xs px-4 py-2">ยกเลิก</button>
                    <button onclick="saveEntry()" class="btn-primary text-slate-950 font-black px-6 py-2.5 rounded-xl text-sm transition">💾 บันทึกผลการแข่ง</button>
                </div>
            </div>
        </div>

        <!-- Admin history list -->
        <div class="card rounded-2xl p-5 border border-slate-800 space-y-3">
            <h3 class="text-sm font-bold text-slate-400 font-mono uppercase tracking-wider">📂 ผลที่บันทึกไว้</h3>
            <div id="admin-history-list" class="space-y-2"></div>
        </div>
    </div>

</div>

<!-- Login Modal -->
<div id="login-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="card card-glow p-6 rounded-2xl max-w-sm w-full space-y-4">
        <h3 class="text-lg font-bold text-emerald-400 font-cyber">🔒 ADMIN LOGIN</h3>
        <input type="text" id="login-user" placeholder="Username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
        <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
        <div class="flex justify-end gap-3">
            <button onclick="closeLogin()" class="px-4 py-2 text-xs text-slate-400 hover:text-slate-200">ยกเลิก</button>
            <button onclick="doLogin()" class="btn-primary text-slate-950 font-black px-5 py-2.5 rounded-xl text-sm transition">เข้าสู่ระบบ</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://rtxhddeaefdmjfuddyhm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0eGhkZGVhZWZkbWpmdWRkeWhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjQzMDYsImV4cCI6MjEwMDk0MDMwNn0.JPaRxJdGOoYIWuocckJ8BNNe9I-TPkBgLUdlWTVNUDU';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BRANCHES = ['สุพรีมสามเสน', 'ชลบุรี', 'ศรีราชา'];
let currentAdmin = sessionStorage.getItem('admin') || null;
let currentBranch = sessionStorage.getItem('branch') || 'สุพรีมสามเสน';
let admins = [];
let history = [];

// ─── INIT ───
async function init() {
    const { data: adminData } = await sb.from('admins').select('*');
    if (adminData) admins = adminData;
    await loadHistory();
    render();
}

async function loadHistory() {
    const { data, error } = await sb.from('history').select('*').eq('branch', currentBranch).order('id', { ascending: false });
    if (error) { console.error(error); return; }
    history = data || [];
}

// ─── BRANCH ───
function setBranch(b) {
    if (currentAdmin) return; // admin branch is fixed
    currentBranch = b;
    sessionStorage.setItem('branch', b);
    loadHistory().then(render);
}

function renderBranchBtns() {
    BRANCHES.forEach(b => {
        const btn = document.getElementById('br-' + b);
        if (!btn) return;
        const active = b === currentBranch;
        btn.className = active
            ? 'px-3 py-1.5 rounded-xl text-xs font-bold transition border border-emerald-500/40 text-emerald-400 bg-emerald-500/10'
            : 'px-3 py-1.5 rounded-xl text-xs font-bold transition border border-slate-700 text-slate-400 hover:text-slate-200';
    });
    // hide branch selector when admin logged in (branch is fixed)
    document.getElementById('branch-btns').classList.toggle('hidden', !!currentAdmin);
}

// ─── AUTH ───
function openLogin() { document.getElementById('login-modal').classList.remove('hidden'); }
function closeLogin() {
    document.getElementById('login-modal').classList.add('hidden');
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
}

async function doLogin() {
    const u = document.getElementById('login-user').value.trim();
    const p = document.getElementById('login-pass').value.trim();
    const found = admins.find(a => a.user === u && a.pass === p);
    if (!found) return alert('Username หรือ Password ไม่ถูกต้อง');
    currentAdmin = found.user;
    currentBranch = found.branch || 'สุพรีมสามเสน';
    sessionStorage.setItem('admin', currentAdmin);
    sessionStorage.setItem('branch', currentBranch);
    closeLogin();
    await loadHistory();
    render();
}

function doLogout() {
    currentAdmin = null;
    sessionStorage.removeItem('admin');
    currentBranch = sessionStorage.getItem('branch') || 'สุพรีมสามเสน';
    render();
}

// ─── API KEY ───
function saveApiKey() {
    const k = document.getElementById('api-key-input').value.trim();
    if (!k.startsWith('sk-ant-')) return alert('API Key ไม่ถูกต้อง (ต้องขึ้นต้นด้วย sk-ant-)');
    sessionStorage.setItem('anthropic_key', k);
    document.getElementById('api-key-input').value = '';
    document.getElementById('api-key-status').innerText = '✅ บันทึก Key แล้ว (session นี้เท่านั้น)';
    document.getElementById('api-key-status').className = 'text-xs text-emerald-400';
}

// ─── OCR ───
async function handleImageUpload() {
    const file = document.getElementById('img-upload').files[0];
    if (!file) return;
    const apiKey = sessionStorage.getItem('anthropic_key');
    if (!apiKey) return alert('กรุณาใส่ Anthropic API Key ก่อนครับ');

    document.getElementById('ocr-loading').classList.remove('hidden');
    document.getElementById('ocr-error').classList.add('hidden');
    document.getElementById('entry-form').classList.add('hidden');

    try {
        const base64 = await toBase64(file);
        const mimeType = file.type || 'image/png';

        const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: 'claude-haiku-4-5-20251001',
                max_tokens: 1024,
                messages: [{
                    role: 'user',
                    content: [
                        { type: 'image', source: { type: 'base64', media_type: mimeType, data: base64 } },
                        { type: 'text', text: 'This is a TCG tournament standings table. Extract all rows and return ONLY a raw JSON array (no markdown, no explanation) with objects: {"pos": number, "name": string, "pts": number}. Use 0 for missing values.' }
                    ]
                }]
            })
        });

        const data = await resp.json();
        if (data.error) throw new Error(data.error.message);
        const text = data.content[0].text.trim();
        const rows = JSON.parse(text.replace(/```json|```/g, '').trim());
        populateForm(rows);
    } catch (err) {
        document.getElementById('ocr-error').innerText = '❌ อ่านรูปไม่สำเร็จ: ' + err.message;
        document.getElementById('ocr-error').classList.remove('hidden');
    } finally {
        document.getElementById('ocr-loading').classList.add('hidden');
        document.getElementById('img-upload').value = '';
    }
}

function toBase64(file) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
    });
}

// ─── FORM ───
function showPasteBox() {
    document.getElementById('paste-box').classList.remove('hidden');
    document.getElementById('entry-form').classList.add('hidden');
    document.getElementById('paste-error').classList.add('hidden');
}
function hidePasteBox() {
    document.getElementById('paste-box').classList.add('hidden');
    document.getElementById('paste-input').value = '';
}

function parsePastedText() {
    const raw = document.getElementById('paste-input').value.trim();
    if (!raw) return;

    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l);

    // Section header patterns — handle OCR typos (Plaver=Player, C=MWP, etc.)
    const HEADERS = {
        pos:  /^pos$/i,
        name: /^play[ae]r[s]?$|^plaver$/i,
        pts:  /^pts?$/i,
    };

    const sections = {};
    let current = null;

    for (const line of lines) {
        let matched = false;
        for (const [key, re] of Object.entries(HEADERS)) {
            if (re.test(line)) {
                current = key;
                sections[current] = [];
                matched = true;
                break;
            }
        }
        if (!matched && current) {
            sections[current].push(line);
        }
    }

    const names = sections.name || [];
    if (names.length === 0) {
        const errEl = document.getElementById('paste-error');
        errEl.innerText = '❌ หาคอลัมน์ "Player" ไม่เจอ — ตรวจสอบว่า text มีคำว่า "Player" หรือ "Plaver" ไหม';
        errEl.classList.remove('hidden');
        return;
    }

    const pos = sections.pos || [];
    const pts = sections.pts || [];

    const rows = names.map((name, i) => ({
        pos:    parseInt(pos[i])    || i + 1,
        name:   name,
        pts:    parseFloat(pts[i])    || 0,
    }));

    hidePasteBox();
    populateForm(rows);
}

function showManualForm() { populateForm([]); }

function populateForm(rows) {
    const tbody = document.getElementById('form-tbody');
    tbody.innerHTML = '';
    rows.forEach(r => addRow(r));
    if (rows.length === 0) addRow();
    // set today's date
    if (!document.getElementById('f-date').value)
        document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('entry-form').classList.remove('hidden');
}

function addRow(r = {}) {
    const tbody = document.getElementById('form-tbody');
    const idx = tbody.rows.length + 1;
    const tr = document.createElement('tr');
    tr.className = 'border-b border-slate-800/60';
    tr.innerHTML = `
        <td class="px-1 py-1 text-slate-500 text-xs text-center w-8">${idx}</td>
        <td class="px-1 py-1"><input type="number" value="${r.pos ?? idx}" class="w-10 bg-slate-950 border border-slate-700 rounded px-1 py-1 text-xs text-center text-slate-200 focus:outline-none row-pos"></td>
        <td class="px-1 py-1"><input type="text" value="${r.name ?? ''}" placeholder="ชื่อผู้แข่ง" class="w-36 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 focus:outline-none row-name"></td>
        <td class="px-1 py-1"><input type="number" value="${r.pts ?? ''}" class="w-14 bg-slate-950 border border-slate-700 rounded px-2 py-1 text-xs text-center text-slate-200 focus:outline-none row-pts"></td>
        <td class="px-1 py-1"><button onclick="this.closest('tr').remove()" class="text-red-400 hover:text-red-300 text-xs px-1">✕</button></td>
    `;
    tbody.appendChild(tr);
}

function cancelForm() {
    document.getElementById('entry-form').classList.add('hidden');
    document.getElementById('f-name').value = '';
    document.getElementById('f-date').value = '';
    document.getElementById('form-tbody').innerHTML = '';
}

function getFormRows() {
    return Array.from(document.querySelectorAll('#form-tbody tr')).map(tr => ({
        pos: parseInt(tr.querySelector('.row-pos').value) || 0,
        name: tr.querySelector('.row-name').value.trim(),
        pts: parseFloat(tr.querySelector('.row-pts').value) || 0,
    })).filter(r => r.name);
}

async function saveEntry() {
    const name = document.getElementById('f-name').value.trim();
    const date = document.getElementById('f-date').value;
    const standings = getFormRows();
    if (!name) return alert('กรุณาใส่ชื่องาน');
    if (!date) return alert('กรุณาใส่วันที่');
    if (standings.length === 0) return alert('กรุณาใส่ข้อมูลผู้แข่งขันอย่างน้อย 1 คน');

    const item = { id: Date.now(), name, date, standings, branch: currentBranch };
    const { error } = await sb.from('history').insert([item]);
    if (error) return alert('❌ บันทึกไม่สำเร็จ: ' + error.message);

    history.unshift(item);
    cancelForm();
    render();
    alert('✅ บันทึกผลการแข่งเรียบร้อยแล้ว');
}

async function deleteEntry(id) {
    if (!confirm('ต้องการลบผลรายการนี้ใช่หรือไม่?')) return;
    const { error } = await sb.from('history').delete().eq('id', id);
    if (error) return alert('❌ ลบไม่สำเร็จ: ' + error.message);
    history = history.filter(h => h.id !== id);
    render();
}

// ─── RENDER ───
function renderStandingsTable(standings, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.innerHTML = standings.map((r, i) => {
        const rankClass = i === 0 ? 'rank-1 font-black text-lg' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'text-slate-400';
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        const rowClass = i < 3 ? 'highlight-row' : '';
        return `<tr class="${rowClass} hover:bg-slate-800/30">
            <td class="px-4 py-3 font-mono font-bold ${rankClass}">${medal || r.pos}</td>
            <td class="px-4 py-3 font-semibold text-slate-100">${r.name}</td>
            <td class="px-4 py-3 text-center font-mono font-bold text-emerald-300 text-base">${r.pts}</td>
        </tr>`;
    }).join('');
}

function render() {
    // auth button
    const authBtn = document.getElementById('auth-btn');
    if (currentAdmin) {
        authBtn.innerHTML = `<div class="flex items-center gap-2">
            <span class="text-xs font-mono text-blue-400 bg-blue-500/10 border border-blue-500/30 px-3 py-1.5 rounded-xl">👑 ${currentAdmin}</span>
            <button onclick="doLogout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold transition">ออกจากระบบ</button>
        </div>`;
    } else {
        authBtn.innerHTML = `<button onclick="openLogin()" class="btn-admin text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">🔒 Admin Login</button>`;
    }

    renderBranchBtns();

    // toggle panels
    document.getElementById('sec-public').classList.toggle('hidden', !!currentAdmin);
    document.getElementById('sec-admin').classList.toggle('hidden', !currentAdmin);

    if (currentAdmin) {
        // admin badge
        document.getElementById('admin-branch-badge').innerText = '🏪 ' + currentBranch;
        // api key status
        const hasKey = !!sessionStorage.getItem('anthropic_key');
        document.getElementById('api-key-status').innerText = hasKey ? '✅ มี API Key ใน session แล้ว' : '';
        document.getElementById('api-key-status').className = 'text-xs ' + (hasKey ? 'text-emerald-400' : 'text-slate-600');

        // admin history
        const adminList = document.getElementById('admin-history-list');
        if (history.length === 0) {
            adminList.innerHTML = '<p class="text-slate-500 text-xs text-center py-4">ยังไม่มีข้อมูล</p>';
        } else {
            adminList.innerHTML = history.map(h => `
                <div class="flex justify-between items-center bg-slate-900/60 px-4 py-3 rounded-xl border border-slate-800">
                    <div>
                        <p class="font-semibold text-slate-200 text-sm">${h.name}</p>
                        <p class="text-xs text-slate-500 font-mono">📅 ${h.date} · ${h.standings?.length || 0} คน</p>
                    </div>
                    <button onclick="deleteEntry(${h.id})" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 rounded bg-red-500/10 border border-red-500/20 transition">🗑️ ลบ</button>
                </div>
            `).join('');
        }
    } else {
        // public view
        const latest = history[0];
        if (latest) {
            document.getElementById('latest-card').classList.remove('hidden');
            document.getElementById('no-data').classList.add('hidden');
            document.getElementById('latest-title').innerText = latest.name;
            document.getElementById('latest-date').innerText = '📅 ' + latest.date;
            renderStandingsTable(latest.standings || [], 'latest-tbody');
        } else {
            document.getElementById('latest-card').classList.add('hidden');
            document.getElementById('no-data').classList.remove('hidden');
        }

        // history list (past results, excluding latest)
        const past = history.slice(1);
        const histSection = document.getElementById('history-section');
        const histList = document.getElementById('history-list');
        if (past.length > 0) {
            histSection.classList.remove('hidden');
            histList.innerHTML = past.map(h => `
                <details class="card rounded-xl overflow-hidden">
                    <summary class="px-4 py-3 cursor-pointer flex justify-between items-center hover:bg-slate-800/30">
                        <div>
                            <span class="font-semibold text-slate-200 text-sm">${h.name}</span>
                            <span class="text-xs text-slate-500 font-mono ml-3">📅 ${h.date}</span>
                        </div>
                        <span class="text-xs text-slate-500">${h.standings?.length || 0} คน ▾</span>
                    </summary>
                    <div class="overflow-x-auto border-t border-slate-800/60">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-900/80 text-xs font-mono text-emerald-400">
                                <tr>
                                    <th class="px-4 py-2">Pos</th><th class="px-4 py-2 text-left">Player</th>
                                    <th class="px-4 py-2 text-center">Pts</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60" id="hist-${h.id}"></tbody>
                        </table>
                    </div>
                </details>
            `).join('');
            // render each history table after DOM update
            requestAnimationFrame(() => {
                past.forEach(h => renderStandingsTable(h.standings || [], 'hist-' + h.id));
            });
        } else {
            histSection.classList.add('hidden');
        }
    }
}

window.onload = init;
</script>
</body>
</html>
