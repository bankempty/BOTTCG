<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Swiss-Round Tournament Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">🏆 TCG Tournament Manager</h1>
                <p class="text-slate-400 text-sm">ระบบจัดแข่ง Swiss-Round & เก็บคะแนนสะสม</p>
            </div>
            <button onclick="resetTournament()" class="bg-red-600/80 hover:bg-red-600 px-4 py-2 rounded-lg text-sm transition">
                ล้างข้อมูลทัวร์นาเมนต์
            </button>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 border-b border-slate-700">
            <button onclick="switchTab('players')" id="tab-players" class="px-4 py-2 font-medium text-indigo-400 border-b-2 border-indigo-400">1. ผู้เข้าแข่งขัน</button>
            <button onclick="switchTab('rounds')" id="tab-rounds" class="px-4 py-2 font-medium text-slate-400 hover:text-slate-200">2. ตารางจับคู่แข่ง</button>
            <button onclick="switchTab('standings')" id="tab-standings" class="px-4 py-2 font-medium text-slate-400 hover:text-slate-200">3. ตารางคะแนน (Standings)</button>
        </div>

        <!-- Tab 1: Registration -->
        <section id="sec-players" class="space-y-4">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-slate-200">ลงทะเบียนผู้เล่น</h2>
                <div class="flex gap-2">
                    <input type="text" id="player-name" placeholder="ชื่อผู้เล่น / ฉายา" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="addPlayer()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-medium transition">เพิ่มผู้เล่น</button>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-md font-semibold text-slate-300 mb-3">รายชื่อผู้เล่นทั้งหมด (<span id="player-count">0</span> คน)</h3>
                <ul id="player-list" class="divide-y divide-slate-700"></ul>
            </div>
        </section>

        <!-- Tab 2: Rounds & Pairing -->
        <section id="sec-rounds" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-200">รอบการแข่งขันที่ <span id="current-round-num">1</span></h2>
                <button onclick="generateNextRound()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg font-semibold transition">
                    ⚡ จับคู่รอบถัดไป
                </button>
            </div>
            <div id="pairings-list" class="space-y-3"></div>
        </section>

        <!-- Tab 3: Standings & Swiss Tiebreakers -->
        <section id="sec-standings" class="hidden space-y-4">
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-700/50 text-slate-300 text-sm">
                        <tr>
                            <th class="p-3">#</th>
                            <th class="p-3">ชื่อผู้เล่น</th>
                            <th class="p-3 text-center">แข่ง</th>
                            <th class="p-3 text-center">W - L - D</th>
                            <th class="p-3 text-center text-indigo-300">Points</th>
                            <th class="p-3 text-center">OMWP %</th>
                            <th class="p-3 text-center">OOMWP %</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table" class="divide-y divide-slate-700 text-slate-200 text-sm"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('tcg_tournament')) || {
            players: [], // { id, name }
            rounds: []   // [ { roundNum, matches: [ { p1, p2, result: 'p1'|'p2'|'draw' } ] } ]
        };

        function saveState() {
            localStorage.setItem('tcg_tournament', JSON.stringify(state));
            render();
        }

        function addPlayer() {
            const input = document.getElementById('player-name');
            const name = input.value.trim();
            if (!name) return;
            state.players.push({ id: Date.now().toString(), name });
            input.value = '';
            saveState();
        }

        function removePlayer(id) {
            state.players = state.players.filter(p => p.id !== id);
            saveState();
        }

        function switchTab(tab) {
            ['players', 'rounds', 'standings'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-2 font-medium text-indigo-400 border-b-2 border-indigo-400";
                } else {
                    btn.className = "px-4 py-2 font-medium text-slate-400 hover:text-slate-200";
                }
            });
        }

        // --- SWISS ENGINE & TIEBREAKERS ---
        function calculateStandings() {
            const stats = {};
            state.players.forEach(p => {
                stats[p.id] = { id: p.id, name: p.name, matchesPlayed: 0, wins: 0, losses: 0, draws: 0, points: 0, opponents: [] };
            });

            // Calculate basic Match Points
            state.rounds.forEach(r => {
                r.matches.forEach(m => {
                    if (!m.result) return;
                    const p1 = stats[m.p1];
                    const p2 = stats[m.p2];

                    if (m.p2 === 'BYE') {
                        if (p1) { p1.wins++; p1.points += 3; p1.matchesPlayed++; }
                        return;
                    }

                    if (p1 && p2) {
                        p1.matchesPlayed++; p2.matchesPlayed++;
                        p1.opponents.push(m.p2); p2.opponents.push(m.p1);

                        if (m.result === 'p1') { p1.wins++; p1.points += 3; p2.losses++; }
                        else if (m.result === 'p2') { p2.wins++; p2.points += 3; p1.losses++; }
                        else if (m.result === 'draw') { p1.draws++; p1.points += 1; p2.draws++; p2.points += 1; }
                    }
                });
            });

            // Calculate MWP (Match Win Percentage - Minimum 0.33 per standard)
            Object.values(stats).forEach(s => {
                const maxPts = s.matchesPlayed * 3;
                s.mwp = maxPts > 0 ? Math.max(s.points / maxPts, 0.33) : 0.33;
            });

            // Calculate OMWP
            Object.values(stats).forEach(s => {
                if (s.opponents.length === 0) { s.omwp = 0.33; return; }
                const oppMwpSum = s.opponents.reduce((sum, oppId) => sum + (stats[oppId] ? stats[oppId].mwp : 0.33), 0);
                s.omwp = oppMwpSum / s.opponents.length;
            });

            // Calculate OOMWP
            Object.values(stats).forEach(s => {
                if (s.opponents.length === 0) { s.oomwp = 0.33; return; }
                const oppOmwpSum = s.opponents.reduce((sum, oppId) => sum + (stats[oppId] ? stats[oppId].omwp : 0.33), 0);
                s.oomwp = oppOmwpSum / s.opponents.length;
            });

            // Sort: Points -> OMWP -> OOMWP
            return Object.values(stats).sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.omwp !== a.omwp) return b.omwp - a.omwp;
                return b.oomwp - a.oomwp;
            });
        }

        function generateNextRound() {
            if (state.players.length < 2) return alert('ต้องมีผู้เล่นอย่างน้อย 2 คน');

            const standings = calculateStandings();
            const currentRound = state.rounds.length + 1;
            let pool = [...standings.map(s => s.id)];
            
            // Randomize first round pool for variety
            if (currentRound === 1) pool.sort(() => Math.random() - 0.5);

            const matches = [];
            
            // Handle Bye if odd players
            if (pool.length % 2 !== 0) {
                // Find lowest rank who hasn't gotten a bye yet
                const byePlayerId = pool.pop(); 
                matches.push({ p1: byePlayerId, p2: 'BYE', result: 'p1' });
            }

            while (pool.length > 0) {
                const p1 = pool.shift();
                const p2 = pool.shift();
                matches.push({ p1, p2, result: null });
            }

            state.rounds.push({ roundNum: currentRound, matches });
            saveState();
            switchTab('rounds');
        }

        function setResult(roundIdx, matchIdx, result) {
            state.rounds[roundIdx].matches[matchIdx].result = result;
            saveState();
        }

        function resetTournament() {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการล้างข้อมูลทัวร์นาเมนต์นี้ทั้งหมด?')) {
                state = { players: [], rounds: [] };
                saveState();
            }
        }

        // --- RENDER UI ---
        function render() {
            // Render Players
            document.getElementById('player-count').innerText = state.players.length;
            const playerList = document.getElementById('player-list');
            playerList.innerHTML = state.players.map(p => `
                <li class="py-3 flex justify-between items-center">
                    <span class="font-medium text-slate-200">${p.name}</span>
                    <button onclick="removePlayer('${p.id}')" class="text-xs text-red-400 hover:text-red-300">ลบ</button>
                </li>
            `).join('');

            // Render Pairings
            const currentRoundIdx = state.rounds.length - 1;
            document.getElementById('current-round-num').innerText = state.rounds.length || 1;
            const pairingsList = document.getElementById('pairings-list');
            
            if (currentRoundIdx >= 0) {
                const round = state.rounds[currentRoundIdx];
                pairingsList.innerHTML = round.matches.map((m, idx) => {
                    const p1 = state.players.find(p => p.id === m.p1)?.name || 'Unknown';
                    const p2 = m.p2 === 'BYE' ? 'BYE (ชนะบาย)' : (state.players.find(p => p.id === m.p2)?.name || 'Unknown');
                    const isBye = m.p2 === 'BYE';

                    return `
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                                <span class="font-bold text-slate-100 ${m.result==='p1'?'text-emerald-400':''}">${p1}</span>
                                <span class="text-xs text-slate-500 font-bold">VS</span>
                                <span class="font-bold text-slate-100 ${m.result==='p2'?'text-emerald-400':''}">${p2}</span>
                            </div>
                            ${!isBye ? `
                            <div class="flex gap-2">
                                <button onclick="setResult(${currentRoundIdx}, ${idx}, 'p1')" class="px-3 py-1 rounded text-xs font-semibold ${m.result==='p1'?'bg-emerald-600 text-white':'bg-slate-700 text-slate-300'}">P1 ชนะ</button>
                                <button onclick="setResult(${currentRoundIdx}, ${idx}, 'draw')" class="px-3 py-1 rounded text-xs font-semibold ${m.result==='draw'?'bg-amber-600 text-white':'bg-slate-700 text-slate-300'}">เสมอ</button>
                                <button onclick="setResult(${currentRoundIdx}, ${idx}, 'p2')" class="px-3 py-1 rounded text-xs font-semibold ${m.result==='p2'?'bg-emerald-600 text-white':'bg-slate-700 text-slate-300'}">P2 ชนะ</button>
                            </div>` : '<span class="text-xs bg-indigo-900/50 text-indigo-300 px-3 py-1 rounded">ชนะบายอัตโนมัติ</span>'}
                        </div>
                    `;
                }).join('');
            } else {
                pairingsList.innerHTML = `<p class="text-slate-500 text-center py-8">ยังไม่ได้เริ่มจับคู่ กดปุ่ม "จับคู่รอบถัดไป" เพื่อเริ่มแข่ง</p>`;
            }

            // Render Standings
            const standings = calculateStandings();
            const standingsTable = document.getElementById('standings-table');
            standingsTable.innerHTML = standings.map((s, idx) => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-3 font-bold ${idx===0?'text-amber-400':idx===1?'text-slate-300':idx===2?'text-amber-600':''}">${idx + 1}</td>
                    <td class="p-3 font-semibold">${s.name}</td>
                    <td class="p-3 text-center">${s.matchesPlayed}</td>
                    <td class="p-3 text-center text-xs text-slate-400">${s.wins} - ${s.losses} - ${s.draws}</td>
                    <td class="p-3 text-center font-bold text-indigo-400 text-base">${s.points}</td>
                    <td class="p-3 text-center text-xs">${(s.omwp * 100).toFixed(1)}%</td>
                    <td class="p-3 text-center text-xs">${(s.oomwp * 100).toFixed(1)}%</td>
                </tr>
            `).join('');
        }

        // Initial Render
        render();
    </script>
</body>
</html>
